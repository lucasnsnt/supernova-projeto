<rect x="1370" y="655" width="500" height="175" rx="12" fill="#FFFFFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
<rect x="1370" y="655" width="8" height="175" rx="4" fill="#0891B2"/>
