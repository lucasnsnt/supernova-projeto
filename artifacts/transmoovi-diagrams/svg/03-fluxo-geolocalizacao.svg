<text x="1392" y="707" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#596579" text-anchor="start">optimizeTours • OAuth conta de serviço</text>
<text x="1392" y="725" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#596579" text-anchor="start">ordem de coleta/entrega, ETAs e polyline</text>
<rect x="1370" y="890" width="500" height="155" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="2" filter="url(#shadow)"/>
