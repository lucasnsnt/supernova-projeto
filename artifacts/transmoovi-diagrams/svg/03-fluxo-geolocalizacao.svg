<text x="1392" y="918" font-family="DejaVu Sans,Arial" font-size="16" font-weight="700" fill="#172033" text-anchor="start">trips + trip_locations</text>
<text x="1392" y="942" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#596579" text-anchor="start">rota congelada no início</text>
<text x="1392" y="960" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#596579" text-anchor="start">última posição sobrescrita (1:1)</text>
<text x="1392" y="978" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#596579" text-anchor="start">visível somente durante a viagem</text>
<rect x="70" y="1060" width="870" height="115" rx="12" fill="#FDECEC" stroke="#C2413B" stroke-dasharray="6 4"/>
<text x="88" y="1087" font-family="DejaVu Sans,Arial" font-size="14" font-weight="700" fill="#C2413B" text-anchor="start">Falhas previstas</text>
<text x="88" y="1109" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#172033" text-anchor="start">Geocodificação desabilitada, baixa confiança ou indisponibilidade bloqueiam prévia/planejamento.</text>
<text x="88" y="1126" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#172033" text-anchor="start">Sem coordenadas ou rota viável, a viagem fica NEEDS_ATTENTION; confirmados não são removidos.</text>
<rect x="1010" y="1060" width="870" height="115" rx="12" fill="#EEF1F5" stroke="#475467" stroke-dasharray="6 4"/>
<text x="1028" y="1087" font-family="DejaVu Sans,Arial" font-size="14" font-weight="700" fill="#475467" text-anchor="start">Legenda</text>
<text x="1028" y="1109" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#172033" text-anchor="start">Roxo: navegador • Azul: serviços internos • Ciano: provedor externo • Verde: persistência</text>
<text x="1028" y="1126" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400" fill="#172033" text-anchor="start">Linha contínua: chamada/fluxo de dados. Numeração indica a sequência principal.</text>
