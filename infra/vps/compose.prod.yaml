name: supernova

services:
  api:
    image: ${SUPERNOVA_IMAGE}
    container_name: supernova-api
    network_mode: host
    restart: unless-stopped
    env_file:
      - ${SUPERNOVA_ENV_FILE:-/opt/supernova/supernova.env}
      - path: ${SUPERNOVA_BOOTSTRAP_ENV_FILE:-/home/lucas/supernova-bootstrap.env}
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ORS_GEOCODING_ENABLED: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=55.0
        -XX:InitialRAMPercentage=20.0
        -XX:+UseSerialGC
        -Djava.security.egd=file:/dev/urandom
    mem_limit: 384m
    mem_reservation: 224m
    mem_swappiness: 20
    cpus: 0.75
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - google_credentials
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  google_credentials:
    file: ${GOOGLE_CREDENTIALS_FILE:-/opt/supernova/google-service-account.json}
