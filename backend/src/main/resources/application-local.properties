# Aceita execução iniciada na raiz do monorepo ou dentro de backend/.
# Os arquivos são privados da máquina e ignorados pelo Git.
spring.config.import=optional:file:.env.local.properties,optional:file:backend/.env.local.properties
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${LOCAL_DATABASE_PATH:./.local/supernova};DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.show-sql=false
app.security.secure-cookies=false
app.security.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.mail.delivery=log
management.health.mail.enabled=false
