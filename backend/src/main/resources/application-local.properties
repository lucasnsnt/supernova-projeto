# Somente o perfil local importa este arquivo privado da máquina.
spring.config.import=optional:file:.env.local.properties
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./.local/supernova;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
app.security.secure-cookies=false
app.security.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.mail.delivery=log
management.health.mail.enabled=false
