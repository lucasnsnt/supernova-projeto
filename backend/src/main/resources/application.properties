spring.application.name=supernova-projeto
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.security.issuer=supernova-api
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=30d
app.security.verification-code-ttl=10m
app.security.registration-token-ttl=15m
app.security.verification-resend-cooldown=1m
app.security.pending-registration-retention=24h
app.security.pending-registration-cleanup-interval=1h
app.security.max-verification-attempts=5
app.security.jwt-secret=${JWT_SECRET:}
app.security.refresh-cookie-name=supernova_refresh
app.security.secure-cookies=${SECURE_COOKIES:false}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

app.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap-admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.bootstrap-admin.name=${ADMIN_BOOTSTRAP_NAME:Administrador}

app.mail.delivery=${MAIL_DELIVERY:log}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

app.transport.zone-id=America/Bahia
app.transport.early-departure-threshold=09:00
app.transport.previous-day-confirmation-time=20:00
app.transport.same-day-confirmation-time=06:00
app.transport.response-deadline-lead=1h
app.transport.preliminary-outbound-lead=1h
app.transport.departure-change-lock=30m
app.transport.maximum-departure-adjustment=30m
app.transport.maximum-return-wait=30m
app.transport.maximum-academic-delay=${MAXIMUM_ACADEMIC_DELAY:45m}
app.transport.google.enabled=${GOOGLE_ROUTE_OPTIMIZATION_ENABLED:false}
app.transport.google.project-id=${GOOGLE_CLOUD_PROJECT:}
app.transport.google.endpoint=https://routeoptimization.googleapis.com
app.transport.google.late-arrival-cost-per-hour=${GOOGLE_LATE_ARRIVAL_COST_PER_HOUR:100}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.transport.geocoding.enabled=${ORS_GEOCODING_ENABLED:false}
app.transport.geocoding.api-key=${ORS_API_KEY:}
app.transport.geocoding.endpoint=${ORS_GEOCODING_ENDPOINT:https://api.heigit.org}
